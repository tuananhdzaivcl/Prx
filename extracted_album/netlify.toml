[build]
  command = "pnpm --filter './artifacts/lop9a2' run build"
  publish = "artifacts/lop9a2/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

[functions]
  node_bundler = "esbuild"
  included_files = ["artifacts/api-server/src/**", "lib/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
