openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for 9A2 Class Memorial Site
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: photos
    description: Photo gallery operations
  - name: admin
    description: Admin management operations
  - name: stats
    description: Statistics operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: Unauthorized

  /photos:
    get:
      operationId: listPhotos
      tags: [photos]
      summary: List all photos
      responses:
        "200":
          description: List of photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"

    post:
      operationId: uploadPhoto
      tags: [photos]
      summary: Upload a photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUploadInput"
      responses:
        "201":
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (account blocked)

  /photos/{id}:
    delete:
      operationId: deletePhoto
      tags: [photos]
      summary: Delete a photo (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get gallery statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryStats"

  /admin/members:
    get:
      operationId: listMembers
      tags: [admin]
      summary: List all members (admin only)
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberAdmin"
        "403":
          description: Forbidden

  /admin/members/{id}/block:
    patch:
      operationId: blockMember
      tags: [admin]
      summary: Block a member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAdmin"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/members/{id}/unblock:
    patch:
      operationId: unblockMember
      tags: [admin]
      summary: Unblock a member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member unblocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAdmin"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/photos:
    get:
      operationId: adminListPhotos
      tags: [admin]
      summary: List all photos with uploader info (admin only)
      responses:
        "200":
          description: List of photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"
        "403":
          description: Forbidden

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Member:
      type: object
      required: [id, username, isAdmin, isBlocked, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        isAdmin:
          type: boolean
        isBlocked:
          type: boolean
        createdAt:
          type: string

    MemberAdmin:
      type: object
      required: [id, username, isAdmin, isBlocked, createdAt, photoCount]
      properties:
        id:
          type: integer
        username:
          type: string
        isAdmin:
          type: boolean
        isBlocked:
          type: boolean
        createdAt:
          type: string
        photoCount:
          type: integer

    RegisterInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/Member"

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Photo:
      type: object
      required: [id, url, caption, uploaderId, uploaderName, createdAt]
      properties:
        id:
          type: integer
        url:
          type: string
        caption:
          type: ["string", "null"]
        uploaderId:
          type: integer
        uploaderName:
          type: string
        createdAt:
          type: string

    PhotoUploadInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        caption:
          type: string

    GalleryStats:
      type: object
      required: [totalPhotos, totalMembers, recentPhotos]
      properties:
        totalPhotos:
          type: integer
        totalMembers:
          type: integer
        recentPhotos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
